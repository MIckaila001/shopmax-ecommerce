<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F5B400;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD54F;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bannerGrad)"/>
  <!-- Decorative circles -->
  <circle cx="100" cy="80" r="40" fill="#fff" opacity="0.2"/>
  <circle cx="1100" cy="320" r="60" fill="#fff" opacity="0.2"/>
  <circle cx="950" cy="80" r="25" fill="#fff" opacity="0.3"/>
  <!-- Main text -->
  <text x="80" y="160" font-family="Arial, sans-serif" font-size="60" font-weight="900" fill="#0A0A0A">MEGA SOLDES</text>
  <text x="80" y="220" font-family="Arial, sans-serif" font-size="80" font-weight="900" fill="#0A0A0A">-50%</text>
  <text x="80" y="270" font-family="Arial, sans-serif" font-size="24" fill="#0A0A0A">Sur toute la collection Mode</text>
  <text x="80" y="300" font-family="Arial, sans-serif" font-size="16" fill="#0A0A0A" opacity="0.8">Offre valable jusqu'au 31 decembre</text>
  <!-- CTA Button -->
  <rect x="80" y="330" width="200" height="50" rx="25" fill="#0A0A0A"/>
  <text x="180" y="362" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#F5B400" text-anchor="middle">DECOUVRIR</text>
  <!-- Phone illustration -->
  <g transform="translate(800, 80)">
    <rect x="0" y="0" width="120" height="220" rx="15" fill="#0A0A0A"/>
    <rect x="10" y="15" width="100" height="190" rx="8" fill="#fff"/>
    <rect x="20" y="30" width="80" height="60" rx="4" fill="#F5B400"/>
    <rect x="20" y="100" width="60" height="6" rx="3" fill="#424242"/>
    <rect x="20" y="115" width="80" height="6" rx="3" fill="#bdbdbd"/>
    <rect x="20" y="130" width="40" height="6" rx="3" fill="#bdbdbd"/>
    <circle cx="60" cy="180" r="15" fill="#F5B400"/>
  </g>
</svg>
