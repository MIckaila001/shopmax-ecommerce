<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="lightGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="#fafafa"/>
  <!-- Light glow background -->
  <circle cx="300" cy="220" r="200" fill="url(#lightGlow)"/>
  <!-- Lamp shade -->
  <path d="M 220 150 L 380 150 L 410 250 L 190 250 Z" fill="#F5B400"/>
  <path d="M 220 150 L 380 150 L 410 250 L 190 250 Z" fill="none" stroke="#cc8400" stroke-width="2"/>
  <!-- Shade pattern lines -->
  <line x1="230" y1="160" x2="225" y2="240" stroke="#cc8400" stroke-width="1" opacity="0.5"/>
  <line x1="260" y1="160" x2="255" y2="240" stroke="#cc8400" stroke-width="1" opacity="0.5"/>
  <line x1="300" y1="160" x2="300" y2="240" stroke="#cc8400" stroke-width="1" opacity="0.5"/>
  <line x1="340" y1="160" x2="345" y2="240" stroke="#cc8400" stroke-width="1" opacity="0.5"/>
  <line x1="370" y1="160" x2="375" y2="240" stroke="#cc8400" stroke-width="1" opacity="0.5"/>
  <!-- Top of shade -->
  <ellipse cx="300" cy="150" rx="80" ry="8" fill="#cc8400"/>
  <!-- Light bulb visible -->
  <ellipse cx="300" cy="260" rx="20" ry="15" fill="#FFF8DC"/>
  <!-- Stand pole -->
  <rect x="295" y="270" width="10" height="180" fill="#424242"/>
  <!-- Base -->
  <ellipse cx="300" cy="455" rx="60" ry="12" fill="#212121"/>
  <ellipse cx="300" cy="450" rx="55" ry="10" fill="#424242"/>
  <ellipse cx="300" cy="448" rx="55" ry="8" fill="#616161"/>
  <!-- Brand text -->
  <text x="300" y="510" font-family="Arial" font-size="12" font-weight="bold" fill="#0a0a0a" text-anchor="middle">LAMPE DE TABLE LED</text>
  <text x="300" y="528" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">E27 - 12W - 3000K</text>
</svg>
