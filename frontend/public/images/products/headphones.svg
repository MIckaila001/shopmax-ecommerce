<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="#fafafa"/>
  <!-- Headband -->
  <path d="M 200 250 Q 200 150 300 150 Q 400 150 400 250" fill="none" stroke="#212121" stroke-width="20" stroke-linecap="round"/>
  <!-- Left ear cup -->
  <ellipse cx="200" cy="320" rx="60" ry="75" fill="#212121"/>
  <ellipse cx="200" cy="320" rx="50" ry="65" fill="#424242"/>
  <ellipse cx="200" cy="320" rx="40" ry="55" fill="#1a1a1a"/>
  <!-- Yellow accent on left -->
  <ellipse cx="200" cy="320" rx="35" ry="50" fill="none" stroke="#F5B400" stroke-width="3"/>
  <!-- Right ear cup -->
  <ellipse cx="400" cy="320" rx="60" ry="75" fill="#212121"/>
  <ellipse cx="400" cy="320" rx="50" ry="65" fill="#424242"/>
  <ellipse cx="400" cy="320" rx="40" ry="55" fill="#1a1a1a"/>
  <!-- Yellow accent on right -->
  <ellipse cx="400" cy="320" rx="35" ry="50" fill="none" stroke="#F5B400" stroke-width="3"/>
  <!-- Brand "SM" on right -->
  <text x="400" y="325" font-family="Arial, sans-serif" font-size="24" fill="#F5B400" text-anchor="middle" font-weight="bold">SM</text>
  <!-- Shadow -->
  <ellipse cx="300" cy="430" rx="150" ry="10" fill="#000" opacity="0.1"/>
</svg>
