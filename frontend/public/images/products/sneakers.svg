<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="shoeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#fafafa"/>
  <!-- Sneaker main body -->
  <path d="M 100 380 Q 100 320 160 300 L 280 290 Q 360 280 420 310 L 480 340 Q 510 350 510 380 L 510 420 L 100 420 Z" fill="url(#shoeGrad)" stroke="#bdbdbd" stroke-width="2"/>
  <!-- Sole -->
  <path d="M 100 420 L 510 420 L 510 440 Q 500 450 480 450 L 120 450 Q 100 450 100 440 Z" fill="#212121"/>
  <!-- Yellow accent (Nike-like swoosh) -->
  <path d="M 180 360 Q 220 340 280 345 Q 340 350 380 380 L 350 385 Q 310 360 250 365 Q 200 370 180 380 Z" fill="#F5B400"/>
  <!-- Laces -->
  <line x1="220" y1="320" x2="280" y2="315" stroke="#424242" stroke-width="2"/>
  <line x1="225" y1="335" x2="285" y2="330" stroke="#424242" stroke-width="2"/>
  <line x1="230" y1="350" x2="290" y2="345" stroke="#424242" stroke-width="2"/>
  <!-- Toe cap -->
  <path d="M 100 380 Q 100 360 130 350 L 140 370 Q 120 380 110 400 Z" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
  <!-- Brand text -->
  <text x="200" y="395" font-family="Arial, sans-serif" font-size="10" fill="#9e9e9e" font-weight="bold">SHOPMAX</text>
  <!-- Shadow -->
  <ellipse cx="305" cy="470" rx="200" ry="10" fill="#000" opacity="0.1"/>
</svg>
