<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#fafafa"/>
  <!-- Book back cover (slightly visible) -->
  <rect x="130" y="120" width="340" height="380" rx="3" fill="#1a1a1a" transform="rotate(-3 300 300)"/>
  <!-- Book main cover -->
  <rect x="135" y="115" width="330" height="380" rx="3" fill="url(#bookCover)"/>
  <!-- Gold border -->
  <rect x="145" y="125" width="310" height="360" rx="2" fill="none" stroke="#F5B400" stroke-width="2"/>
  <rect x="155" y="135" width="290" height="340" rx="2" fill="none" stroke="#F5B400" stroke-width="1" opacity="0.6"/>
  <!-- Title -->
  <text x="300" y="220" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#F5B400" text-anchor="middle">SHOPMAX</text>
  <text x="300" y="260" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">L'HISTOIRE</text>
  <text x="300" y="285" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">DU COMMERCE</text>
  <text x="300" y="310" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">EN AFRIQUE</text>
  <!-- Decorative line -->
  <line x1="220" y1="335" x2="380" y2="335" stroke="#F5B400" stroke-width="1"/>
  <!-- Author -->
  <text x="300" y="380" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">ISMAILA BOUBA</text>
  <!-- Year -->
  <text x="300" y="420" font-family="Georgia, serif" font-size="11" fill="#F5B400" text-anchor="middle">ÉDITION 2025</text>
  <!-- Pages edge -->
  <rect x="465" y="115" width="6" height="380" fill="#F5B5B5" opacity="0.5"/>
  <line x1="468" y1="120" x2="468" y2="490" stroke="#0a0a0a" stroke-width="0.5"/>
  <!-- Shadow -->
  <ellipse cx="300" cy="510" rx="180" ry="8" fill="#000" opacity="0.15"/>
</svg>
