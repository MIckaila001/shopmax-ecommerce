<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="#fafafa"/>
  <!-- Watch strap top -->
  <rect x="270" y="100" width="60" height="100" rx="4" fill="#3e2723"/>
  <!-- Watch case -->
  <circle cx="300" cy="300" r="120" fill="#212121"/>
  <circle cx="300" cy="300" r="110" fill="#F5B400"/>
  <circle cx="300" cy="300" r="100" fill="#212121"/>
  <!-- Watch face -->
  <circle cx="300" cy="300" r="95" fill="#1a1a1a"/>
  <!-- Hour markers -->
  <line x1="300" y1="215" x2="300" y2="225" stroke="#F5B400" stroke-width="3"/>
  <line x1="385" y1="300" x2="375" y2="300" stroke="#F5B400" stroke-width="3"/>
  <line x1="300" y1="385" x2="300" y2="375" stroke="#F5B400" stroke-width="3"/>
  <line x1="215" y1="300" x2="225" y2="300" stroke="#F5B400" stroke-width="3"/>
  <!-- Hour hand -->
  <line x1="300" y1="300" x2="300" y2="250" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="300" y1="300" x2="345" y2="280" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="300" cy="300" r="6" fill="#F5B400"/>
  <!-- Crown -->
  <rect x="418" y="290" width="12" height="20" rx="2" fill="#9e9e9e"/>
  <!-- Watch strap bottom -->
  <rect x="270" y="400" width="60" height="100" rx="4" fill="#3e2723"/>
  <!-- Stitching -->
  <line x1="275" y1="105" x2="325" y2="105" stroke="#8d6e63" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="275" y1="495" x2="325" y2="495" stroke="#8d6e63" stroke-width="1" stroke-dasharray="3,2"/>
</svg>
