<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="#fafafa"/>
  <!-- TV frame -->
  <rect x="80" y="150" width="440" height="280" rx="8" fill="#0a0a0a"/>
  <!-- Screen -->
  <rect x="95" y="165" width="410" height="250" rx="3" fill="#1a1a2e"/>
  <!-- Screen content - colorful scene -->
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5B400;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="95" y="165" width="410" height="250" rx="3" fill="url(#screenGrad)"/>
  <!-- Sun -->
  <circle cx="450" cy="230" r="30" fill="#FFD93D" opacity="0.9"/>
  <!-- Mountains -->
  <path d="M 95 350 L 180 250 L 250 320 L 350 220 L 505 350 Z" fill="#1a1a2e" opacity="0.4"/>
  <!-- Tree silhouette -->
  <rect x="180" y="370" width="6" height="40" fill="#0a0a0a"/>
  <circle cx="183" cy="370" r="20" fill="#0a0a0a"/>
  <!-- TV stand -->
  <rect x="270" y="430" width="60" height="20" fill="#424242"/>
  <rect x="200" y="450" width="200" height="6" rx="3" fill="#212121"/>
  <!-- Brand text -->
  <text x="300" y="425" font-family="Arial" font-size="12" font-weight="bold" fill="#F5B400" text-anchor="middle">SHOPMAX 4K</text>
  <!-- Screen size text -->
  <text x="300" y="490" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">Smart TV 55" 4K UHD</text>
  <!-- Shadow -->
  <ellipse cx="300" cy="475" rx="180" ry="6" fill="#000" opacity="0.1"/>
</svg>
