<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5B400;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D49E00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6914;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#fafafa"/>
  <!-- Bag handles -->
  <path d="M 230 200 Q 230 130 300 130 Q 370 130 370 200" fill="none" stroke="#0a0a0a" stroke-width="6"/>
  <path d="M 230 200 Q 230 130 300 130 Q 370 130 370 200" fill="none" stroke="#424242" stroke-width="3"/>
  <!-- Bag main body -->
  <path d="M 160 200 L 440 200 L 460 460 Q 460 480 440 480 L 160 480 Q 140 480 140 460 Z" fill="url(#bagGrad)"/>
  <!-- Top of bag darker -->
  <rect x="160" y="200" width="280" height="20" fill="#0a0a0a" opacity="0.3"/>
  <!-- Center decoration -->
  <circle cx="300" cy="340" r="50" fill="#0a0a0a" opacity="0.2"/>
  <text x="300" y="350" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">SM</text>
  <!-- Decorative stripe -->
  <rect x="160" y="290" width="280" height="4" fill="#0a0a0a" opacity="0.3"/>
  <rect x="160" y="390" width="280" height="4" fill="#0a0a0a" opacity="0.3"/>
  <!-- Stitching details -->
  <line x1="170" y1="220" x2="170" y2="470" stroke="#0a0a0a" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <line x1="430" y1="220" x2="430" y2="470" stroke="#0a0a0a" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <!-- Bottom shadow -->
  <ellipse cx="300" cy="490" rx="160" ry="6" fill="#000" opacity="0.2"/>
  <!-- Brand text -->
  <text x="300" y="525" font-family="Arial" font-size="14" font-weight="bold" fill="#0a0a0a" text-anchor="middle">SAC À MAIN</text>
  <text x="300" y="545" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">Cuir synthétique premium</text>
</svg>
