<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#fafafa"/>
  <!-- Jacket body -->
  <path d="M 200 180 L 250 140 L 350 140 L 400 180 L 420 220 L 410 460 L 190 460 L 180 220 Z" fill="url(#jacketGrad)"/>
  <!-- Hood -->
  <path d="M 230 150 Q 300 90 370 150 L 360 200 L 240 200 Z" fill="url(#jacketGrad)"/>
  <!-- Hood opening -->
  <ellipse cx="300" cy="160" rx="35" ry="25" fill="#1a1a1a"/>
  <!-- Center zipper -->
  <line x1="300" y1="170" x2="300" y2="460" stroke="#F5B400" stroke-width="3"/>
  <line x1="300" y1="170" x2="300" y2="460" stroke="#424242" stroke-width="1"/>
  <!-- Zipper pull -->
  <rect x="295" y="200" width="10" height="15" rx="2" fill="#F5B400"/>
  <!-- Pockets -->
  <rect x="210" y="320" width="70" height="80" rx="3" fill="none" stroke="#F5B400" stroke-width="2"/>
  <rect x="320" y="320" width="70" height="80" rx="3" fill="none" stroke="#F5B400" stroke-width="2"/>
  <!-- Sleeves -->
  <path d="M 180 220 L 130 280 L 130 440 L 200 460 Z" fill="url(#jacketGrad)"/>
  <path d="M 420 220 L 470 280 L 470 440 L 400 460 Z" fill="url(#jacketGrad)"/>
  <!-- Cuffs -->
  <rect x="130" y="430" width="70" height="20" fill="#1a1a1a"/>
  <rect x="400" y="430" width="70" height="20" fill="#1a1a1a"/>
  <!-- Brand text -->
  <text x="300" y="510" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0a0a0a" text-anchor="middle">VESTE À CAPUCHE</text>
  <text x="300" y="530" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">Style urbain - Hiver 2025</text>
  <!-- Shadow -->
  <ellipse cx="300" cy="475" rx="170" ry="8" fill="#000" opacity="0.15"/>
</svg>
