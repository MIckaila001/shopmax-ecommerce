<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="dressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5B400;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8C42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E63946;stop-opacity:1" />
    </linearGradient>
    <pattern id="ankaraPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="8" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="3" fill="#0a0a0a"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="#fafafa"/>
  <!-- Mannequin hanger -->
  <line x1="300" y1="100" x2="300" y2="130" stroke="#424242" stroke-width="2"/>
  <path d="M 280 130 Q 300 120 320 130" fill="none" stroke="#424242" stroke-width="2"/>
  <!-- Dress body -->
  <path d="M 250 140 L 350 140 L 380 220 L 360 280 L 380 460 L 220 460 L 240 280 L 220 220 Z" fill="url(#dressGrad)"/>
  <!-- Ankara pattern overlay -->
  <path d="M 250 140 L 350 140 L 380 220 L 360 280 L 380 460 L 220 460 L 240 280 L 220 220 Z" fill="url(#ankaraPattern)" opacity="0.4"/>
  <!-- Neckline -->
  <path d="M 280 140 Q 300 155 320 140" fill="#fafafa" opacity="0.8"/>
  <!-- Waist accent -->
  <rect x="240" y="275" width="120" height="10" fill="#0a0a0a" opacity="0.3"/>
  <!-- Pattern dots -->
  <circle cx="270" cy="180" r="4" fill="#fff" opacity="0.4"/>
  <circle cx="320" cy="200" r="4" fill="#fff" opacity="0.4"/>
  <circle cx="290" cy="350" r="4" fill="#fff" opacity="0.4"/>
  <circle cx="340" cy="400" r="4" fill="#fff" opacity="0.4"/>
  <circle cx="260" cy="420" r="4" fill="#fff" opacity="0.4"/>
  <!-- Brand text -->
  <text x="300" y="510" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0a0a0a" text-anchor="middle">ROBE AFRICAINE</text>
  <text x="300" y="530" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">Collection Premium</text>
</svg>
