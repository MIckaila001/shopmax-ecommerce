<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="juiceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FF6600;stop-opacity:0.95" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#fafafa"/>
  <!-- Juice bottle body -->
  <path d="M 240 160 L 240 200 Q 220 220 220 250 L 220 480 Q 220 500 240 500 L 360 500 Q 380 500 380 480 L 380 250 Q 380 220 360 200 L 360 160 Z" fill="url(#juiceGrad)"/>
  <!-- Glass shine -->
  <rect x="240" y="220" width="15" height="270" fill="#fff" opacity="0.3"/>
  <rect x="265" y="220" width="5" height="270" fill="#fff" opacity="0.2"/>
  <!-- Cap -->
  <rect x="250" y="130" width="100" height="35" rx="3" fill="#1B5E20"/>
  <rect x="255" y="135" width="90" height="25" rx="2" fill="#2E7D32"/>
  <!-- Cap ridges -->
  <line x1="260" y1="140" x2="260" y2="160" stroke="#1B5E20" stroke-width="1"/>
  <line x1="270" y1="140" x2="270" y2="160" stroke="#1B5E20" stroke-width="1"/>
  <line x1="340" y1="140" x2="340" y2="160" stroke="#1B5E20" stroke-width="1"/>
  <line x1="330" y1="140" x2="330" y2="160" stroke="#1B5E20" stroke-width="1"/>
  <!-- Label -->
  <rect x="235" y="290" width="130" height="160" fill="#fff"/>
  <text x="300" y="320" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#FF6600" text-anchor="middle">SHOPMAX</text>
  <text x="300" y="345" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">100% NATUREL</text>
  <!-- Fruit illustration -->
  <circle cx="300" cy="380" r="25" fill="#FFA500"/>
  <ellipse cx="300" cy="370" rx="20" ry="8" fill="#FFB733"/>
  <path d="M 300 355 L 305 345 L 295 345 Z" fill="#2E7D32"/>
  <text x="300" y="425" font-family="Arial" font-size="10" font-weight="bold" fill="#333" text-anchor="middle">JUS DE MANGUE</text>
  <text x="300" y="442" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">1 LITRE</text>
  <!-- Shadow -->
  <ellipse cx="300" cy="510" rx="90" ry="6" fill="#000" opacity="0.15"/>
</svg>
