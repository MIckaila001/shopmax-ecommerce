<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#laptopGrad)"/>
  <!-- Laptop base -->
  <rect x="100" y="380" width="400" height="20" rx="3" fill="#9e9e9e"/>
  <rect x="120" y="395" width="360" height="8" rx="2" fill="#757575"/>
  <!-- Laptop screen -->
  <rect x="130" y="140" width="340" height="240" rx="8" fill="#424242"/>
  <rect x="140" y="150" width="320" height="220" rx="4" fill="url(#screenGrad)"/>
  <!-- Screen content - code editor look -->
  <rect x="160" y="180" width="20" height="3" fill="#F5B400"/>
  <rect x="160" y="195" width="80" height="3" fill="#64b5f6"/>
  <rect x="160" y="210" width="60" height="3" fill="#81c784"/>
  <rect x="180" y="225" width="100" height="3" fill="#64b5f6"/>
  <rect x="180" y="240" width="40" height="3" fill="#ff8a65"/>
  <rect x="180" y="255" width="90" height="3" fill="#64b5f6"/>
  <!-- Apple-like logo on lid -->
  <circle cx="300" cy="270" r="8" fill="#616161" opacity="0.5"/>
  <!-- Shadow -->
  <ellipse cx="300" cy="420" rx="200" ry="8" fill="#000" opacity="0.1"/>
</svg>
