<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="#fafafa"/>
  <!-- PS5 console body -->
  <rect x="100" y="200" width="400" height="200" rx="20" fill="#fff"/>
  <rect x="100" y="200" width="400" height="200" rx="20" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <!-- Inner panels -->
  <path d="M 120 220 Q 120 210 130 210 L 280 210 L 280 390 L 130 390 Q 120 390 120 380 Z" fill="#f5f5f5"/>
  <path d="M 480 220 Q 480 210 470 210 L 320 210 L 320 390 L 470 390 Q 480 390 480 380 Z" fill="#f5f5f5"/>
  <!-- Center black section -->
  <rect x="280" y="210" width="40" height="180" fill="#1a1a1a"/>
  <!-- Blue LED strip -->
  <rect x="290" y="230" width="20" height="3" fill="#2196F3"/>
  <rect x="290" y="370" width="20" height="3" fill="#2196F3"/>
  <!-- PS Logo -->
  <text x="200" y="310" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#003791" text-anchor="middle">PS5</text>
  <!-- Controller (DualSense) -->
  <g transform="translate(150, 430)">
    <ellipse cx="150" cy="40" rx="120" ry="35" fill="#fff" stroke="#e0e0e0" stroke-width="2"/>
    <circle cx="100" cy="35" r="12" fill="#1a1a1a"/>
    <circle cx="200" cy="35" r="12" fill="#1a1a1a"/>
    <rect x="145" y="30" width="10" height="10" fill="#1a1a1a"/>
  </g>
  <!-- Brand text -->
  <text x="200" y="380" font-family="Arial" font-size="14" fill="#9e9e9e" text-anchor="middle">PlayStation 5</text>
</svg>
