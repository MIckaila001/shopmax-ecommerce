<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="perfumeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:0.95" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#fafafa"/>
  <!-- Perfume bottle body -->
  <path d="M 220 200 L 220 460 Q 220 480 240 480 L 360 480 Q 380 480 380 460 L 380 200 Z" fill="url(#perfumeGrad)" stroke="#cc8400" stroke-width="2"/>
  <!-- Glass shine effect -->
  <rect x="235" y="220" width="20" height="240" rx="3" fill="#fff" opacity="0.3"/>
  <rect x="260" y="220" width="5" height="240" fill="#fff" opacity="0.2"/>
  <!-- Neck of bottle -->
  <rect x="270" y="170" width="60" height="40" fill="#cc8400"/>
  <!-- Cap -->
  <rect x="260" y="130" width="80" height="45" rx="5" fill="#0a0a0a"/>
  <rect x="265" y="135" width="70" height="35" rx="3" fill="#1a1a1a"/>
  <!-- Cap shine -->
  <rect x="275" y="140" width="5" height="25" fill="#424242"/>
  <!-- Label area -->
  <rect x="240" y="320" width="120" height="100" fill="#fff" opacity="0.9"/>
  <text x="300" y="360" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#0a0a0a" text-anchor="middle">SHOPMAX</text>
  <text x="300" y="385" font-family="Georgia, serif" font-size="12" fill="#666" text-anchor="middle">EAU DE PARFUM</text>
  <text x="300" y="405" font-family="Arial" font-size="10" fill="#999" text-anchor="middle">100ml</text>
  <!-- Liquid level visible -->
  <rect x="230" y="400" width="140" height="60" fill="url(#perfumeGrad)" opacity="0.5"/>
  <!-- Shadow -->
  <ellipse cx="300" cy="490" rx="90" ry="6" fill="#000" opacity="0.15"/>
</svg>
