<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="ballGrad" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bdbdbd;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="#fafafa"/>
  <!-- Ball main body -->
  <circle cx="300" cy="300" r="160" fill="url(#ballGrad)"/>
  <circle cx="300" cy="300" r="160" fill="none" stroke="#424242" stroke-width="2"/>
  <!-- Pentagons (football pattern) -->
  <polygon points="300,180 340,200 330,245 270,245 260,200" fill="#0a0a0a"/>
  <polygon points="200,250 240,270 230,315 170,315 160,270" fill="#0a0a0a"/>
  <polygon points="400,250 440,270 430,315 370,315 360,270" fill="#0a0a0a"/>
  <polygon points="250,370 290,390 280,435 220,435 210,390" fill="#0a0a0a"/>
  <polygon points="350,370 390,390 380,435 320,435 310,390" fill="#0a0a0a"/>
  <!-- Connecting lines -->
  <line x1="300" y1="200" x2="240" y2="280" stroke="#0a0a0a" stroke-width="3"/>
  <line x1="300" y1="200" x2="360" y2="280" stroke="#0a0a0a" stroke-width="3"/>
  <line x1="200" y1="300" x2="300" y2="400" stroke="#0a0a0a" stroke-width="3"/>
  <line x1="400" y1="300" x2="300" y2="400" stroke="#0a0a0a" stroke-width="3"/>
  <line x1="200" y1="300" x2="400" y2="300" stroke="#0a0a0a" stroke-width="3"/>
  <line x1="240" y1="280" x2="200" y2="300" stroke="#0a0a0a" stroke-width="3"/>
  <line x1="360" y1="280" x2="400" y2="300" stroke="#0a0a0a" stroke-width="3"/>
  <line x1="300" y1="400" x2="250" y2="380" stroke="#0a0a0a" stroke-width="3"/>
  <line x1="300" y1="400" x2="350" y2="380" stroke="#0a0a0a" stroke-width="3"/>
  <!-- Highlight -->
  <ellipse cx="250" cy="240" rx="30" ry="20" fill="#fff" opacity="0.4"/>
  <!-- Brand text -->
  <text x="300" y="510" font-family="Arial" font-size="14" font-weight="bold" fill="#0a0a0a" text-anchor="middle">BALLON DE FOOTBALL</text>
  <text x="300" y="530" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">Taille 5 - Adidas style</text>
  <!-- Shadow -->
  <ellipse cx="300" cy="490" rx="160" ry="12" fill="#000" opacity="0.15"/>
</svg>
